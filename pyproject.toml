[project]
name = "todoium"
version = "0.4.0"
authors = [{ name = "tangkikodo", email = "allmonday@126.com" }]
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "pydantic-resolve>=5.3.1",
    "rich",
    "sqlalchemy[aiosqlite]>=2.0.49",
    "textual",
    "uvicorn[standard]>=0.46.0",
    "websockets>=12.0",
]

[project.scripts]
t = "todo_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["todo_cli"]
artifacts = ["todo_cli/alembic/**/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
