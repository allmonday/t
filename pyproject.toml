[project]
name = "todo-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "pydantic-resolve>=5.3.1",
    "rich",
    "sqlalchemy[aiosqlite]>=2.0.49",
    "textual",
]

[project.scripts]
t = "todo_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
